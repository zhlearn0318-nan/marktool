name: Backend tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      AIGC_REQUIRE_EXIFTOOL: "1"
      EXIFTOOL_PATH: ${{ github.workspace }}/tools/Image-ExifTool-13.59/exiftool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install pinned ExifTool 13.59
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p tools
          curl --fail --silent --show-error --location \
            https://exiftool.org/Image-ExifTool-13.59.tar.gz \
            --output tools/Image-ExifTool-13.59.tar.gz
          tar -xzf tools/Image-ExifTool-13.59.tar.gz -C tools
          chmod +x tools/Image-ExifTool-13.59/exiftool
          test "$(tools/Image-ExifTool-13.59/exiftool -ver)" = "13.59"
      - name: Run all tests with real ExifTool
        run: python -m pytest tests -q
